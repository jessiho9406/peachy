name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Khoá ký (nếu đã thêm vào Secrets)
        env:
          KS_B64: ${{ secrets.PEACHY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PEACHY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PEACHY_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "PEACHY_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Đã có khoá ký"
          else
            echo "Chưa có khoá ký: AAB sẽ chưa ký"
          fi
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Peachy.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Peachy.aab
      - uses: actions/upload-artifact@v5
        with:
          name: Peachy
          path: out/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/Peachy.apk out/Peachy.aab --title "Peachy (bản ${{ github.run_number }})" --notes "Peachy.apk: cài thử trên điện thoại. Peachy.aab: nộp lên CH Play." --latest
      - name: Lưu file vào nhánh apk
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp out/* /tmp/
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/Peachy.apk /tmp/Peachy.aab .
          git add Peachy.apk Peachy.aab
          git commit -qm "Bản ${{ github.run_number }}"
          git push -f origin apk
